app-id: org.fkoehler.KTailctl
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ktailctl
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=/run/tailscale:ro
build-options:
  prepend-path: /usr/lib/sdk/golang/bin
modules:
  - name: ktailctl
    buildsystem: cmake-ninja
    config-opts:
      - -DKTAILCTL_FLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/f-koehler/KTailctl.git
        tag: v0.22.0-beta4
        commit: 9bc0eac7df6f554d787faf4ed08521fc4d941c0d
      - type: archive
        url: https://github.com/f-koehler/KTailctl/releases/download/v0.22.0-beta4/ktailctl-wrapper-vendor-v0.22.0-beta4.tar.gz
        sha256: 3baf37a9f04748f5f99ffdfdc21bc0656d6e870a804334a0ceb52b426d91dfcb
        strip-components: 0
        dest: src/tailscale/wrapper
