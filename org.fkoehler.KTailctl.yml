app-id: org.fkoehler.KTailctl
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ktailctl
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=/run/tailscale:ro
build-options:
  prepend-path: /usr/lib/sdk/golang/bin
modules:
  - name: ktailctl
    buildsystem: cmake-ninja
    config-opts:
      - -DKTAILCTL_FLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/f-koehler/KTailctl.git
        tag: v0.22.0
        commit: 18450dfea4aec686b2b110d4329250442ddbe4d0
      - type: archive
        url: https://github.com/f-koehler/KTailctl/releases/download/v0.22.0/ktailctl-wrapper-vendor-v0.22.0.tar.gz
        sha256: 52b1ad28fbff7b6609ea6f87024ecf8d58c1d403d404b9bcd5e10aad61ed9e71
        strip-components: 0
        dest: src/tailscale/wrapper
