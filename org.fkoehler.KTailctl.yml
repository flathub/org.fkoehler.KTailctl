app-id: org.fkoehler.KTailctl
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ktailctl
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=/run/tailscale:ro
build-options:
  prepend-path: /usr/lib/sdk/golang/bin
modules:
  - name: ktailctl
    buildsystem: cmake-ninja
    config-opts:
      - -DKTAILCTL_FLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/f-koehler/KTailctl.git
        tag: v0.22.1
        commit: 243b22838f033ebacb2ee44d63a2ab36852dce52
      - type: archive
        url: https://github.com/f-koehler/KTailctl/releases/download/v0.22.1/ktailctl-wrapper-vendor-v0.22.1.tar.gz
        sha256: 308aa3646b6d1bbd3d5fe35b86a6a2aa8126a7aa80fff124617820d3a5cda614
        strip-components: 0
        dest: src/tailscale/wrapper
