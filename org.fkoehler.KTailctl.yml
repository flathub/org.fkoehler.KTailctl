app-id: org.fkoehler.KTailctl
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ktailctl
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=/run/tailscale:ro
build-options:
  prepend-path: /usr/lib/sdk/golang/bin
modules:
  - name: ktailctl
    buildsystem: cmake-ninja
    config-opts:
      - -DKTAILCTL_FLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/f-koehler/KTailctl.git
        tag: v0.22.0-beta3
        commit: 69586824ccf47264f5f828995cefda9f3a4564b6
      - type: archive
        url: https://github.com/f-koehler/KTailctl/releases/download/v0.22.0-beta3/ktailctl-wrapper-vendor-v0.22.0-beta3.tar.gz
        sha256: d58272bb738c0563a544a2f126fb65eb288e8f380891407ca76ebd1231223f01
        strip-components: 0
        dest: src/tailscale/wrapper
