app-id: org.fkoehler.KTailctl
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ktailctl
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=/run/tailscale:ro
build-options:
  env:
    GOTOOLCHAIN: local
    GOPROXY: off
cleanup:
  - /tools
modules:
  - name: go-toolchain
    buildsystem: simple
    build-commands:
      - mkdir -p /app/tools/go
      - cp -r . /app/tools/go
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://go.dev/dl/go1.27.2.linux-amd64.tar.gz
        sha256: ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5
        x-checker-data:
          type: json
          url: https://go.dev/dl/?mode=json
          version-query: .[0].version
          url-query: '"https://go.dev/dl/" + (.[0].files[] | select(.os=="linux" and
            .arch=="amd64" and .kind=="archive") | .filename)'
      - type: archive
        only-arches:
          - aarch64
        url: https://go.dev/dl/go1.27.2.linux-arm64.tar.gz
        sha256: 94f3e30b8e374bc285e7dadc11e0865726b9bc6e85b841ccceaabc0214c6b7c8
        x-checker-data:
          type: json
          url: https://go.dev/dl/?mode=json
          version-query: .[0].version
          url-query: '"https://go.dev/dl/" + (.[0].files[] | select(.os=="linux" and
            .arch=="arm64" and .kind=="archive") | .filename)'
  - name: ktailctl
    buildsystem: cmake-ninja
    config-opts:
      - -DKTAILCTL_FLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DGO_EXECUTABLE=/app/tools/go/bin/go
    sources:
      - type: git
        url: https://github.com/f-koehler/KTailctl.git
        tag: v0.22.3
        commit: 8e6ddb1ecb500b9955b176b8bd91f922a9c3379f
      - type: archive
        url: https://github.com/f-koehler/KTailctl/releases/download/v0.22.3/ktailctl-wrapper-vendor-v0.22.3.tar.gz
        sha256: 4890a1e32396e7e6468615b09f95827a3d5761807f4df59e95a6d30b5884860a
        strip-components: 0
        dest: src/tailscale/wrapper
